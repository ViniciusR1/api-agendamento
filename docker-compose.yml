version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: booking-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - booking_pg_data:/var/lib/postgresql/data

volumes:
  booking_pg_data: